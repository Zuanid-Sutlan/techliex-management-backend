<div class="login-container" style="max-width: 400px; margin: 10vh auto;">
    <div class="card" style="padding: 2.5rem 2rem;">
        <!-- Techliex Brand Header for Login -->
        <div style="display: flex; flex-direction: column; align-items: center; margin-bottom: 2.5rem;">
            <img src="/assets/images/ic_techliex_logo.jpeg" alt="Techliex Logo" style="width: 72px; height: 72px; border-radius: 20px; object-fit: cover; margin-bottom: 1rem; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
            <span style="font-size: 28px; font-weight: bold; color: var(--text-primary); letter-spacing: -0.5px; line-height: 1.2;">Techliex<span style="color: var(--primary-color);"> AI</span></span>
            <span style="font-size: 11px; font-weight: bold; letter-spacing: 1.5px; color: var(--text-secondary); margin-top: 4px;">MANAGEMENT SUITE</span>
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" class="form-control" required placeholder="Enter username">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" class="form-control" required placeholder="Enter password">
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Sign In</button>
        </form>
        <div id="loginError" style="color: var(--danger-color); margin-top: 1rem; text-align: center; display: none;"></div>
    </div>
</div>
