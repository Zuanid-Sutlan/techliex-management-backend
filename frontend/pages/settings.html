<div class="page-header" style="margin-bottom: 2rem;">
    <h1>Settings</h1>
    <p style="color: var(--text-secondary);">System configuration and preferences</p>
</div>

<div class="card" style="max-width: 600px;">
    <h3 style="margin-bottom: 1.5rem; padding-bottom: 0.5rem; border-bottom: 1px solid var(--border-color);">General Settings</h3>

    <div class="form-group">
        <label>Theme</label>
        <select class="form-control" id="themeSelect" style="max-width: 200px;">
            <option value="system">System Default</option>
            <option value="light">Light</option>
            <option value="dark">Dark</option>
        </select>
    </div>

    <div class="form-group" style="margin-top: 1.5rem;">
        <label>Overdue Days Limit</label>
        <input type="number" class="form-control" id="overdueLimit" value="7" style="max-width: 200px;">
        <p style="font-size: 0.875rem; color: var(--text-secondary); margin-top: 0.25rem;">Alert when an order is delayed beyond this limit.</p>
    </div>

    <button class="btn btn-primary" id="saveSettingsBtn" style="margin-top: 1.5rem;">Save Changes</button>
    <div id="settingsMessage" style="margin-top: 1rem; color: var(--success-color); display: none;">Settings saved successfully!</div>
</div>
