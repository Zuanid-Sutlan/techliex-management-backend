<div class="page-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
    <div>
        <h1>Orders</h1>
        <p style="color: var(--text-secondary);">Manage and track customer orders & logistics</p>
    </div>
    <button class="btn btn-primary" id="addOrderBtn"><i class="fas fa-plus"></i> New Multi-Item Order</button>
</div>

<!-- Search & User Filter Bar -->
<div style="display: flex; gap: 1rem; margin-bottom: 1rem; flex-wrap: wrap;">
    <input type="text" id="orderSearchInput" class="form-control" placeholder="Search by order # or product name..." style="flex: 2; min-width: 220px;">
    <select id="orderUserFilter" class="form-control" style="flex: 1; min-width: 160px; display: none;">
        <option value="all">All Members / Buyers</option>
        <!-- Populated via JS -->
    </select>
</div>

<!-- Filter Tabs -->
<div id="orderTabs" style="display: flex; gap: 1rem; margin-bottom: 1.5rem; border-bottom: 1px solid var(--border-color); padding-bottom: 0.5rem; overflow-x: auto;">
    <span class="order-tab" data-filter="all" style="cursor: pointer; font-weight: bold; color: var(--primary-color); border-bottom: 2px solid var(--primary-color); padding-bottom: 0.25rem;">All Orders</span>
    <span class="order-tab" data-filter="Active" style="cursor: pointer; color: var(--text-secondary); padding-bottom: 0.25rem;">Active</span>
    <span class="order-tab" data-filter="Shipped" style="cursor: pointer; color: var(--text-secondary); padding-bottom: 0.25rem;">Shipped</span>
    <span class="order-tab" data-filter="Completed" style="cursor: pointer; color: var(--text-secondary); padding-bottom: 0.25rem;">Completed</span>
</div>

<div class="card" id="ordersContainer">
    <div style="text-align: center; padding: 2rem; color: var(--text-secondary);">
        <i class="fas fa-inbox" style="font-size: 3rem; margin-bottom: 1rem; opacity: 0.5;"></i>
        <p>Loading orders...</p>
    </div>
</div>

<!-- Add Multi-Item Order Modal -->
<div id="addOrderModal" class="modal-overlay hidden">
    <div class="modal-content" style="max-width: 650px;">
        <div class="modal-header">
            <h2>Create Multi-Item Order</h2>
            <button class="modal-close" id="closeAddOrderModal">&times;</button>
        </div>
        <form id="addOrderForm">
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                <div class="form-group">
                    <label>Order Number</label>
                    <input type="text" id="orderNumber" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>Order Date</label>
                    <input type="date" id="orderDate" class="form-control" required>
                </div>
            </div>

            <div class="form-group">
                <label>Shipping Delivery Address</label>
                <textarea id="orderAddress" class="form-control" rows="2" required placeholder="Full street address, city, country"></textarea>
            </div>

            <div class="form-group">
                <label>Payment Proof Screenshot</label>
                <div id="orderDropzone" class="dropzone">
                    <i class="fas fa-receipt" style="font-size: 2rem; color: var(--primary-color); margin-bottom: 0.5rem;"></i>
                    <p style="font-size: 0.9rem; color: var(--text-secondary);">Drag & drop screenshot here, or <span style="color: var(--primary-color); font-weight: 500;">browse</span></p>
                    <input type="file" id="orderImgFile" accept="image/*" style="display: none;">
                </div>
                <div id="orderImgPreviewContainer" class="dropzone-preview-container hidden">
                    <img id="orderImgPreview" class="dropzone-preview" src="" alt="Preview">
                    <span id="orderImgFileName" style="font-size: 0.85rem; color: var(--text-secondary);"></span>
                    <button type="button" id="removeOrderImg" class="btn btn-outline" style="padding: 0.2rem 0.5rem; font-size: 0.75rem; color: var(--danger-color);">Remove</button>
                </div>
                <input type="hidden" id="orderPaymentScreenshot">
            </div>

            <!-- Order Items Cart Section -->
            <div style="border-top: 1px solid var(--border-color); padding-top: 1rem; margin-top: 1rem;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.75rem;">
                    <h3 style="font-size: 1rem; color: var(--primary-color);">Order Items Cart</h3>
                    <button type="button" id="addItemBtn" class="btn btn-outline" style="padding: 0.25rem 0.75rem; font-size: 0.85rem;"><i class="fas fa-plus"></i> Add Another Product</button>
                </div>
                <div id="orderItemsList" style="display: flex; flex-direction: column; gap: 1rem; max-height: 250px; overflow-y: auto; padding-right: 4px;">
                    <!-- Dynamically populated cart items -->
                </div>
            </div>

            <div id="orderError" style="color: var(--danger-color); margin-top: 1rem; display: none;"></div>
            <div style="display: flex; justify-content: flex-end; gap: 1rem; margin-top: 1.5rem;">
                <button type="button" class="btn btn-outline" id="cancelAddOrder">Cancel</button>
                <button type="submit" class="btn btn-primary">Submit Batch Orders</button>
            </div>
        </form>
    </div>
</div>

<!-- Order Details & Chat Console Modal -->
<div id="orderDetailsServiceModal" class="modal-overlay hidden">
    <div class="modal-content" style="max-width: 800px; max-height: 90vh; display: flex; flex-direction: column;">
        <div class="modal-header">
            <h2 id="detailOrderNumber">Order Details</h2>
            <button class="modal-close" id="closeOrderDetailsModal">&times;</button>
        </div>
        <div id="orderDetailsServiceBody" style="flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 1.5rem; padding-right: 4px;">
            <!-- Content populated via JS -->
        </div>
        <div style="display: flex; justify-content: flex-end; gap: 1rem; margin-top: 1.5rem; border-top: 1px solid var(--border-color); padding-top: 1rem;">
            <button type="button" class="btn btn-outline" id="closeOrderDetailsBtn">Close</button>
        </div>
    </div>
</div>
