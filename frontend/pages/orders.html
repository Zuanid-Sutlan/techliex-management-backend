<div class="page-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
    <div>
        <h1>Orders</h1>
        <p style="color: var(--text-secondary);">Manage and track customer orders</p>
    </div>
    <button class="btn btn-primary"><i class="fas fa-plus"></i> New Order</button>
</div>

<!-- Tabs Simulation -->
<div style="display: flex; gap: 1rem; margin-bottom: 1.5rem; border-bottom: 1px solid var(--border-color); padding-bottom: 0.5rem;">
    <span style="cursor: pointer; font-weight: bold; color: var(--primary-color); border-bottom: 2px solid var(--primary-color);">All</span>
    <span style="cursor: pointer; color: var(--text-secondary);">Needs Tracking</span>
    <span style="cursor: pointer; color: var(--text-secondary);">Completed</span>
</div>

<div class="card">
    <div style="text-align: center; padding: 2rem; color: var(--text-secondary);">
        <i class="fas fa-inbox" style="font-size: 3rem; margin-bottom: 1rem; opacity: 0.5;"></i>
        <p>No orders found or loading...</p>
    </div>
</div>
