<div class="dashboard-header" style="margin-bottom: 2rem;">
    <h1>Dashboard</h1>
    <p style="color: var(--text-secondary);">Overview of your system metrics</p>
</div>

<div class="stats-grid" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 1.5rem;">
    <div class="card stat-card">
        <h3>Total Products</h3>
        <div class="stat-value" id="stat-products" style="font-size: 2rem; font-weight: bold; color: var(--primary-color);">0</div>
    </div>
    <div class="card stat-card">
        <h3>Active Orders</h3>
        <div class="stat-value" id="stat-orders" style="font-size: 2rem; font-weight: bold; color: var(--primary-color);">0</div>
    </div>
    <div class="card stat-card">
        <h3>Total Revenue</h3>
        <div class="stat-value" id="stat-revenue" style="font-size: 2rem; font-weight: bold; color: var(--success-color);">$0.00</div>
    </div>
</div>

<div class="recent-activity" style="margin-top: 2rem;">
    <h2>Recent Activity</h2>
    <div class="card" style="margin-top: 1rem;">
        <p style="color: var(--text-secondary);">Loading activity logs...</p>
    </div>
</div>
