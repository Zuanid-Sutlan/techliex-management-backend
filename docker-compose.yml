services:
  db:
    image: postgres:16-alpine
    container_name: techliex_postgres
    restart: always
    environment:
      POSTGRES_DB: techliex_db
      POSTGRES_USER: techliex
      POSTGRES_PASSWORD: techliex@123
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U techliex -d techliex_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:latest
    container_name: techliex_adminer
    restart: always
    ports:
      - "8081:8080"
    depends_on:
      - db

volumes:
  postgres_data:
