services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: techliex_api
    restart: always
    ports:
      - "8080:8080"
    environment:
      - DB_JDBC_URL=${DB_JDBC_URL:-jdbc:postgresql://db:5432/techliex_db}
      - DB_USER=${DB_USER:-techliex}
      - DB_PASSWORD=${DB_PASSWORD:-techliex@123}
      - JWT_SECRET=${JWT_SECRET:-techliex-super-secret-jwt-key-2025!}
      - JWT_ISSUER=${JWT_ISSUER:-http://localhost:8080/}
      - JWT_AUDIENCE=${JWT_AUDIENCE:-http://localhost:8080/api/v1}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    container_name: techliex_postgres
    restart: always
    environment:
      POSTGRES_DB: techliex_db
      POSTGRES_USER: techliex
      POSTGRES_PASSWORD: techliex@123
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U techliex -d techliex_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:latest
    container_name: techliex_adminer
    restart: always
    ports:
      - "8081:8080"
    depends_on:
      - db

volumes:
  postgres_data:
