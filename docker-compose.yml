services:
  db:
    image: postgres:16-alpine
    container_name: techliex_postgres
    restart: always
    environment:
      POSTGRES_DB: techliex_db
      POSTGRES_USER: techliex
      POSTGRES_PASSWORD: techliex@123
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U techliex -d techliex_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: techliex_api
    restart: always
    ports:
      - "8080:8080"
    environment:
      KTOR_ENV: production
      DB_DRIVER: org.postgresql.Driver
      DB_JDBC_URL: jdbc:postgresql://db:5432/techliex_db
      DB_USER: techliex
      DB_PASSWORD: techliex@123
      JWT_SECRET: techliex-super-secret-jwt-key-2025!
      JWT_ISSUER: http://localhost:8080/
      JWT_AUDIENCE: http://localhost:8080/api/v1
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads

volumes:
  postgres_data:
  uploads_data:
