ktor:
  deployment:
    port: 8080
    host: "0.0.0.0"
  application:
    modules:
      - com.techliex.ApplicationKt.module

db:
  driver: "$DB_DRIVER:org.postgresql.Driver"
  jdbcUrl: "$DB_JDBC_URL:jdbc:postgresql://localhost:5432/techliex_db"
  user: "$DB_USER:techliex"
  password: "$DB_PASSWORD:techliex@123"

jwt:
  secret: "$JWT_SECRET:techliex-super-secret-jwt-key-2025!"
  issuer: "$JWT_ISSUER:http://0.0.0.0:8080/"
  audience: "$JWT_AUDIENCE:http://0.0.0.0:8080/api/v1"
  realm: "Techliex Management API"

storage:
  uploadDir: "uploads"


