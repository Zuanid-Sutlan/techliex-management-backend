openapi: 3.0.3
info:
  title: Techliex Management REST API
  description: API for product hunting, team sharing, warehouse management, order processing, and logistics tracking.
  version: 1.0.0
  contact:
    name: Techliex Support
servers:
  - url: http://localhost:8080
    description: Local Server
  - url: http://0.0.0.0:8080
    description: Docker / Production Server

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Enter JWT Bearer token obtained from `/api/v1/auth/login`

  schemas:
    ApiResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
          nullable: true
        data:
          type: object
          nullable: true

    LoginRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          example: admin
        password:
          type: string
          example: admin123

    UserDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        username:
          type: string
          example: admin
        password:
          type: string
          example: ""
        name:
          type: string
          example: Administrator
        role:
          type: string
          enum: [Admin, Member, Warehouse]
          example: Admin
        isActive:
          type: boolean
          example: true
        createdAt:
          type: string
          example: "2025-01-01T00:00:00Z"

    LoginResponse:
      type: object
      properties:
        token:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        user:
          $ref: '#/components/schemas/UserDto'

    CreateUserRequest:
      type: object
      required:
        - username
        - password
        - name
      properties:
        username:
          type: string
          example: john_doe
        password:
          type: string
          example: password123
        name:
          type: string
          example: John Doe
        role:
          type: string
          default: Member
          enum: [Admin, Member, Warehouse]

    CreateProductRequest:
      type: object
      required:
        - title
        - productImageUrl
        - sourceLink
        - sourcePrice
        - referenceLink
        - referencePrice
      properties:
        title:
          type: string
          example: Wireless Mechanical Keyboard
        description:
          type: string
          nullable: true
          example: RGB backlit keyboard with blue switches
        productImageUrl:
          type: string
          example: /uploads/keyboard.jpg
        sourceLink:
          type: string
          example: https://supplier.com/item/123
        sourcePrice:
          type: number
          format: double
          example: 25.50
        referenceLink:
          type: string
          example: https://amazon.com/item/123
        referencePrice:
          type: number
          format: double
          example: 59.99
        shareWithUsernames:
          type: array
          items:
            type: string
          example: ["member_user1", "member_user2"]

    UpdateWarehouseRequest:
      type: object
      required:
        - warehousePrice
      properties:
        warehousePrice:
          type: number
          format: double
          example: 30.00
        warehouseNote:
          type: string
          nullable: true
          example: Verified stock in warehouse A

    ProductDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 10
        userId:
          type: integer
          format: int64
          example: 1
        creatorName:
          type: string
          nullable: true
          example: Administrator
        title:
          type: string
          example: Wireless Mechanical Keyboard
        description:
          type: string
          nullable: true
          example: RGB backlit keyboard with blue switches
        productImageUrl:
          type: string
          example: /uploads/keyboard.jpg
        sourceLink:
          type: string
          example: https://supplier.com/item/123
        sourcePrice:
          type: number
          format: double
          example: 25.50
        referenceLink:
          type: string
          example: https://amazon.com/item/123
        referencePrice:
          type: number
          format: double
          example: 59.99
        warehousePrice:
          type: number
          format: double
          example: 30.00
        warehouseNote:
          type: string
          nullable: true
          example: In Stock
        sharedUsernames:
          type: array
          items:
            type: string
          example: ["member1"]
        createdAt:
          type: string
          example: "2025-01-01T00:00:00Z"

    CreateOrderRequest:
      type: object
      required:
        - orderDate
        - productId
        - address
        - quantity
        - listingPrice
        - paymentImageUrl
      properties:
        orderDate:
          type: string
          example: "15/01/2025"
        productId:
          type: integer
          format: int64
          example: 10
        address:
          type: string
          example: 123 Main St, New York, NY 10001
        variationNote:
          type: string
          nullable: true
          example: "Color: Black, Switches: Blue"
        quantity:
          type: integer
          example: 2
        listingPrice:
          type: number
          format: double
          example: 55.00
        paymentImageUrl:
          type: string
          example: /uploads/payment_proof_123.jpg

    UpdateLogisticsRequest:
      type: object
      required:
        - trackId
        - company
      properties:
        trackId:
          type: string
          example: TRK987654321
        company:
          type: string
          example: FedEx Express

    OrderDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 100
        orderDate:
          type: string
          example: "15/01/2025"
        userId:
          type: integer
          format: int64
          example: 2
        userName:
          type: string
          nullable: true
          example: John Doe
        productId:
          type: integer
          format: int64
          example: 10
        productTitle:
          type: string
          nullable: true
          example: Wireless Mechanical Keyboard
        address:
          type: string
          example: 123 Main St, New York, NY 10001
        variationNote:
          type: string
          nullable: true
          example: "Color: Black"
        quantity:
          type: integer
          example: 2
        listingPrice:
          type: number
          format: double
          example: 55.00
        paymentImageUrl:
          type: string
          example: /uploads/payment_proof_123.jpg
        trackId:
          type: string
          example: TRK987654321
        company:
          type: string
          example: FedEx Express
        status:
          type: string
          enum: [Active, Shipped, Completed]
          example: Shipped
        createdAt:
          type: string
          example: "2025-01-01T00:00:00Z"

    DashboardStatsDto:
      type: object
      properties:
        productCount:
          type: integer
          format: int64
          example: 25
        activeOrdersCount:
          type: integer
          format: int64
          example: 8
        totalEarnings:
          type: number
          format: double
          example: 12500.00

    UploadResponse:
      type: object
      properties:
        imageUrl:
          type: string
          example: /uploads/a1b2c3d4-e5f6.jpg

paths:
  /api/v1/auth/login:
    post:
      tags:
        - Authentication
      summary: User Login
      description: Authenticates a user with username and password and returns a JWT Bearer token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login Successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Login successful
                  data:
                    $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Invalid payload
        '401':
          description: Invalid username or password

  /api/v1/auth/me:
    get:
      tags:
        - Authentication
      summary: Get Current User Profile
      description: Returns profile details for the authenticated user based on JWT token.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Profile retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/UserDto'
        '401':
          description: Unauthorized / Token invalid
        '404':
          description: User not found

  /api/v1/users:
    post:
      tags:
        - User Management
      summary: Create New User (Admin Only)
      description: Allows administrators to create new user accounts.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: User created
        '403':
          description: Admin access required
        '409':
          description: Username already exists

    get:
      tags:
        - User Management
      summary: Get All Active Users
      description: Returns a list of all active user accounts.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Users retrieved

  /api/v1/users/{username}:
    get:
      tags:
        - User Management
      summary: Get User Profile by Username
      security:
        - BearerAuth: []
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: User profile found
        '404':
          description: User not found

    delete:
      tags:
        - User Management
      summary: Deactivate User (Admin Only)
      security:
        - BearerAuth: []
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: User deactivated
        '403':
          description: Admin access required
        '404':
          description: User not found

  /api/v1/products:
    post:
      tags:
        - Products
      summary: Create Product Hunt
      description: Creates a new product hunt opportunity and optionally shares it with target team members.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProductRequest'
      responses:
        '201':
          description: Product created successfully

    get:
      tags:
        - Products
      summary: Get Visible Products
      description: Returns products scoped by user role (Admin/Warehouse sees all, Member sees created/shared).
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Products list retrieved

  /api/v1/products/{id}:
    get:
      tags:
        - Products
      summary: Get Product Details
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Product details
        '404':
          description: Product not found

    delete:
      tags:
        - Products
      summary: Delete Product (Admin Only)
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Product deleted
        '403':
          description: Admin role required
        '404':
          description: Product not found

  /api/v1/products/{id}/warehouse:
    patch:
      tags:
        - Products
      summary: Update Warehouse Cost & Notes (Admin / Warehouse Only)
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateWarehouseRequest'
      responses:
        '200':
          description: Warehouse information updated
        '403':
          description: Admin or Warehouse role required
        '404':
          description: Product not found

  /api/v1/orders:
    post:
      tags:
        - Orders
      summary: Place Order
      description: Submits a new order with address, quantity, price, and payment proof image URL.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '201':
          description: Order placed successfully

    get:
      tags:
        - Orders
      summary: Get Scoped Orders
      description: Returns orders according to role scope, sorted by status (Active -> Shipped -> Completed).
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Orders retrieved

  /api/v1/orders/{id}:
    get:
      tags:
        - Orders
      summary: Get Order Details
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Order details
        '404':
          description: Order not found

  /api/v1/orders/{id}/logistics:
    patch:
      tags:
        - Orders
      summary: Update Shipping Logistics (Admin Only)
      description: Sets courier tracking ID and company name, updating order status to 'Shipped'.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateLogisticsRequest'
      responses:
        '200':
          description: Logistics updated and order marked as Shipped
        '403':
          description: Admin role required
        '404':
          description: Order not found

  /api/v1/orders/{id}/complete:
    patch:
      tags:
        - Orders
      summary: Finalize Order
      description: Updates order status to 'Completed'.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Order marked as Completed
        '404':
          description: Order not found

  /api/v1/dashboard/stats:
    get:
      tags:
        - Dashboard
      summary: Get Dashboard Statistics
      description: Computes total products, active orders, and revenue earnings scoped by user role.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Metrics retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/DashboardStatsDto'

  /api/v1/media/upload:
    post:
      tags:
        - Media Upload
      summary: Upload Image File
      description: Accepts multipart/form-data image upload and returns static image URL.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: File uploaded successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/UploadResponse'
        '400':
          description: Invalid file payload
