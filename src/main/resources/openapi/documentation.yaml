openapi: 3.0.3
info:
  title: Techliex Management REST API
  description: API for product hunting, team sharing, warehouse management, order processing, and logistics tracking.
  version: 1.0.0
  contact:
    name: Techliex Support
servers:
  - url: http://localhost:8080
    description: Local Server
  - url: http://0.0.0.0:8080
    description: Docker / Production Server

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Enter JWT Bearer token obtained from `/api/v1/auth/login`

  schemas:
    ApiResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
          nullable: true
        data:
          type: object
          nullable: true

    VersionDto:
      type: object
      properties:
        versionName:
          type: string
          example: 1.0.0-alpha1
        versionCode:
          type: integer
          example: 10001
        name:
          type: string
          example: Techliex Management

    HealthCheckDto:
      type: object
      properties:
        serverStatus:
          type: string
          example: UP
        dbStatus:
          type: string
          example: CONNECTED
        databaseType:
          type: string
          example: PostgreSQL
        dbMessage:
          type: string
          example: Database is connected and healthy.
        timestamp:
          type: string
          example: "2025-02-23T12:00:00Z"

    LoginRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          example: umair
        password:
          type: string
          example: umair123

    ChangePasswordRequest:
      type: object
      required:
        - oldPassword
        - newPassword
      properties:
        oldPassword:
          type: string
          example: oldpass123
        newPassword:
          type: string
          example: newpass123

    ResetPasswordRequest:
      type: object
      required:
        - newPassword
      properties:
        newPassword:
          type: string
          example: resetpass123

    UserDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        username:
          type: string
          example: umair
        password:
          type: string
          example: ""
        name:
          type: string
          example: Umair
        role:
          type: string
          enum: [Admin, Member, Warehouse]
          example: Admin
        isActive:
          type: boolean
          example: true
        createdAt:
          type: string
          example: "2025-01-01T00:00:00Z"

    LoginResponse:
      type: object
      properties:
        token:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        user:
          $ref: '#/components/schemas/UserDto'

    CreateUserRequest:
      type: object
      required:
        - username
        - password
        - name
      properties:
        username:
          type: string
          example: john_doe
        password:
          type: string
          example: password123
        name:
          type: string
          example: John Doe
        role:
          type: string
          default: Member
          enum: [Admin, Member, Warehouse]

    CreateProductRequest:
      type: object
      required:
        - title
        - productImageUrl
        - sourceLink
        - sourcePrice
        - referenceLink
        - referencePrice
      properties:
        title:
          type: string
          example: Wireless Mechanical Keyboard
        description:
          type: string
          nullable: true
          example: RGB backlit keyboard with blue switches
        productImageUrl:
          type: string
          description: Base64 image string or Data URL
          example: "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQ..."
        sourceLink:
          type: string
          example: https://supplier.com/item/123
        sourcePrice:
          type: number
          format: double
          example: 25.50
        referenceLink:
          type: string
          example: https://amazon.com/item/123
        referencePrice:
          type: number
          format: double
          example: 59.99
        sharedUserIds:
          type: array
          items:
            type: integer
            format: int64
          example: [2, 3]
        shareWithUsernames:
          type: array
          items:
            type: string
          example: ["member_user1", "member_user2"]

    UpdateProductRequest:
      type: object
      properties:
        title:
          type: string
          example: Wireless Mechanical Keyboard
        description:
          type: string
          nullable: true
          example: RGB backlit keyboard with blue switches
        productImageUrl:
          type: string
          description: Base64 image string or Data URL
          example: "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQ..."
        sourceLink:
          type: string
          example: https://supplier.com/item/123
        sourcePrice:
          type: number
          format: double
          example: 25.50
        referenceLink:
          type: string
          example: https://amazon.com/item/123
        referencePrice:
          type: number
          format: double
          example: 59.99
        sharedUserIds:
          type: array
          items:
            type: integer
            format: int64
          example: [2, 3]
        shareWithUsernames:
          type: array
          items:
            type: string
          example: ["member_user1", "member_user2"]

    UpdateProductSharesRequest:
      type: object
      properties:
        sharedUserIds:
          type: array
          items:
            type: integer
            format: int64
          example: [2, 3]
        shareWithUsernames:
          type: array
          items:
            type: string
          example: ["member_user1", "member_user2"]

    UpdateWarehouseRequest:
      type: object
      required:
        - warehousePrice
      properties:
        warehousePrice:
          type: number
          format: double
          example: 30.00
        warehouseNote:
          type: string
          nullable: true
          example: Verified stock in warehouse A

    ProductDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 10
        userId:
          type: integer
          format: int64
          example: 1
        creatorName:
          type: string
          nullable: true
          example: Umair
        title:
          type: string
          example: Wireless Mechanical Keyboard
        description:
          type: string
          nullable: true
          example: RGB backlit keyboard with blue switches
        productImageUrl:
          type: string
          description: Base64 image string
          example: "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQ..."
        sourceLink:
          type: string
          example: https://supplier.com/item/123
        sourcePrice:
          type: number
          format: double
          example: 25.50
        referenceLink:
          type: string
          example: https://amazon.com/item/123
        referencePrice:
          type: number
          format: double
          example: 59.99
        warehousePrice:
          type: number
          format: double
          example: 30.00
        warehouseNote:
          type: string
          nullable: true
          example: In Stock
        sharedUserIds:
          type: array
          items:
            type: integer
            format: int64
          example: [2, 3]
        sharedUsernames:
          type: array
          items:
            type: string
          example: ["member1"]
        createdAt:
          type: string
          example: "2025-01-01T00:00:00Z"

    CreateOrderRequest:
      type: object
      required:
        - productId
        - address
      properties:
        orderNumber:
          type: string
          description: User-provided order number
          example: "ORD-998877"
        orderDate:
          type: string
          example: "15/01/2025"
        productId:
          type: integer
          format: int64
          example: 10
        address:
          type: string
          example: 123 Main St, New York, NY 10001
        note:
          type: string
          nullable: true
          example: "Custom variation note / preferences"
        variationNote:
          type: string
          nullable: true
          example: "Color: Black, Switches: Blue"
        quantity:
          type: integer
          example: 2
        listingPrice:
          type: number
          format: double
          example: 55.00
        paymentScreenshot:
          type: string
          description: Payment screenshot Base64 string format
          example: "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQ..."
        paymentImageUrl:
          type: string
          description: Legacy payment image URL/Base64
          example: "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQ..."

    UpdateLogisticsRequest:
      type: object
      required:
        - trackId
        - company
      properties:
        trackId:
          type: string
          example: TRK987654321
        company:
          type: string
          example: FedEx Express

    UpdateOrderStatusRequest:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          example: "Refund Approved"

    OpenRefundRequest:
      type: object
      properties:
        message:
          type: string
          nullable: true
          example: "Product damaged on delivery, requesting refund."
        screenshots:
          type: array
          items:
            type: string
          description: Base64 screenshot strings
          example: ["data:image/jpeg;base64,/9j/4AAQSkZJRgABAQ..."]

    SendRefundMessageRequest:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          example: "Here is the invoice and photo proof."
        screenshots:
          type: array
          items:
            type: string
          description: Base64 screenshot strings
          example: ["data:image/jpeg;base64,/9j/4AAQSkZJRgABAQ..."]

    RefundMessageDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        orderId:
          type: integer
          format: int64
          example: 100
        senderId:
          type: integer
          format: int64
          example: 2
        senderName:
          type: string
          example: "john_doe"
        senderRole:
          type: string
          example: "Member"
        message:
          type: string
          example: "Requesting refund due to wrong item received."
        screenshots:
          type: array
          items:
            type: string
          example: ["data:image/jpeg;base64,/9j/4AAQSkZJRgABAQ..."]
        createdAt:
          type: string
          example: "2025-01-15T12:00:00Z"

    OrderDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 100
        orderNumber:
          type: string
          example: "ORD-1712345678"
        orderDate:
          type: string
          example: "15/01/2025"
        userId:
          type: integer
          format: int64
          example: 2
        userName:
          type: string
          nullable: true
          example: John Doe
        productId:
          type: integer
          format: int64
          example: 10
        productName:
          type: string
          description: Auto-collected product title
          example: Wireless Mechanical Keyboard
        productImage:
          type: string
          description: Auto-collected product image
          example: https://example.com/keyboard.jpg
        productSourcePrice:
          type: number
          format: double
          description: Auto-collected product source price
          example: 20.00
        productTitle:
          type: string
          nullable: true
          example: Wireless Mechanical Keyboard
        address:
          type: string
          example: 123 Main St, New York, NY 10001
        note:
          type: string
          nullable: true
          example: "Color: Black, Custom variation note"
        variationNote:
          type: string
          nullable: true
          example: "Color: Black"
        quantity:
          type: integer
          example: 2
        listingPrice:
          type: number
          format: double
          example: 55.00
        paymentImageUrl:
          type: string
          description: Base64 image string
          example: "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQ..."
        trackId:
          type: string
          example: TRK987654321
        company:
          type: string
          example: FedEx Express
        status:
          type: string
          enum: [Active, Shipped, Completed]
          example: Shipped
        createdAt:
          type: string
          example: "2025-01-01T00:00:00Z"
        updatedAt:
          type: string
          example: "2025-01-02T10:30:00Z"

    DashboardStatsDto:
      type: object
      properties:
        productCount:
          type: integer
          format: int64
          example: 25
        activeOrdersCount:
          type: integer
          format: int64
          example: 8
        totalEarnings:
          type: number
          format: double
          example: 12500.00

paths:
  /api/v1/health:
    get:
      tags:
        - System
      summary: Server & Database Health Check
      description: Verifies whether the server is running and tests active PostgreSQL database connectivity.
      responses:
        '200':
          description: Server and Database are healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Server and Database are healthy
                  data:
                    $ref: '#/components/schemas/HealthCheckDto'
        '503':
          description: Database connection error
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: Database connection error
                  data:
                    $ref: '#/components/schemas/HealthCheckDto'

  /api/v1/version:
    get:
      tags:
        - System
      summary: Get Application Version
      description: Returns semantic version name, calculated version code, and application name.
      responses:
        '200':
          description: Version details retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: App version retrieved successfully
                  data:
                    $ref: '#/components/schemas/VersionDto'

  /api/v1/auth/login:
    post:
      tags:
        - Authentication
      summary: User Login
      description: Authenticates a user with username and password and returns a JWT Bearer token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login Successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Login successful
                  data:
                    $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Invalid payload
        '401':
          description: Invalid username or password

  /api/v1/auth/me:
    get:
      tags:
        - Authentication
      summary: Get Current User Profile
      description: Returns profile details for the authenticated user based on JWT token.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Profile retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/UserDto'
        '401':
          description: Unauthorized / Token invalid
        '404':
          description: User not found

  /api/v1/auth/change-password:
    patch:
      tags:
        - Authentication
      summary: Change User Password
      description: Allows authenticated user to change their password by verifying current old password.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          description: Password changed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Password changed successfully
        '400':
          description: Current password is incorrect or invalid payload

  /api/v1/users:
    post:
      tags:
        - User Management
      summary: Create New User (Admin Only)
      description: Allows administrators to create new user accounts.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/UserDto'
        '403':
          description: Admin access required
        '409':
          description: Username already exists

    get:
      tags:
        - User Management
      summary: Get All Active & Inactive Users
      description: Returns a list of all user accounts (both active and inactive).
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Users retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/UserDto'

  /api/v1/users/change-password:
    patch:
      tags:
        - User Management
      summary: Change Self Password
      description: Allows authenticated user to change their own password by providing old and new password.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          description: Password changed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Password changed successfully
        '400':
          description: Current password is incorrect or invalid payload

  /api/v1/users/{username}:
    get:
      tags:
        - User Management
      summary: Get User Profile by Username
      security:
        - BearerAuth: []
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: User profile found
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/UserDto'
        '404':
          description: User not found

    delete:
      tags:
        - User Management
      summary: Deactivate User (Admin Only)
      security:
        - BearerAuth: []
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: User deactivated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: User deactivated successfully
        '403':
          description: Admin access required
        '404':
          description: User not found

  /api/v1/users/{username}/permanent:
    delete:
      tags:
        - User Management
      summary: Permanently Delete User (Admin Only)
      description: Permanently removes the user record and associated products, orders, and chats from the database.
      security:
        - BearerAuth: []
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: User permanently deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: User permanently deleted from database
        '403':
          description: Admin access required
        '404':
          description: User not found

  /api/v1/users/{username}/activate:
    patch:
      tags:
        - User Management
      summary: Activate User Account (Admin Only)
      description: Allows administrators to re-activate deactivated user accounts.
      security:
        - BearerAuth: []
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: User activated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: User activated successfully
        '403':
          description: Admin access required
        '404':
          description: User not found

  /api/v1/users/{username}/reset-password:
    patch:
      tags:
        - User Management
      summary: Reset User Password (Admin Only / Forgot Password)
      description: Allows administrators to force-reset any user's password.
      security:
        - BearerAuth: []
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '200':
          description: User password reset successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: User password reset successfully
        '403':
          description: Admin access required
        '404':
          description: User not found

  /api/v1/products:
    post:
      tags:
        - Products
      summary: Create Product Hunt
      description: Creates a new product hunt opportunity with Base64 product image string.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProductRequest'
      responses:
        '201':
          description: Product created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/ProductDto'

    get:
      tags:
        - Products
      summary: Get Visible Products
      description: Returns products scoped by user role (Admin/Warehouse sees all, Member sees created/shared).
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Products list retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ProductDto'

  /api/v1/products/{id}:
    get:
      tags:
        - Products
      summary: Get Product Details
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Product details
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/ProductDto'
        '403':
          description: Access denied (Product not shared with you)
        '404':
          description: Product not found

    patch:
      tags:
        - Products
      summary: Update Product Details (Admin or Product Creator)
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProductRequest'
      responses:
        '200':
          description: Product updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/ProductDto'
        '403':
          description: Only Admin or product creator can update product
        '404':
          description: Product not found

    delete:
      tags:
        - Products
      summary: Delete Product (Admin Only)
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Product deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Product deleted successfully
        '403':
          description: Admin role required
        '404':
          description: Product not found

  /api/v1/products/{id}/shares:
    patch:
      tags:
        - Products
      summary: Update Product Shares / Visibility (Admin or Product Creator)
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProductSharesRequest'
      responses:
        '200':
          description: Product shares updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/ProductDto'
        '403':
          description: Only Admin or product creator can update shares
        '404':
          description: Product not found

  /api/v1/products/{id}/warehouse:
    patch:
      tags:
        - Products
      summary: Update Warehouse Cost & Notes (Admin / Warehouse Only)
      security:
        - BearerAuth: []
      parameters:
